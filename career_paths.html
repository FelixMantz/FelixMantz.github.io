    font-weight: 700;

    color: #f1f5f9;
  }
  #title-block p {

    color: #64748b;
    margin-top: 4px;
  }

    flex-direction: column;
    gap: 10px;
  }
  .legend-item {

    gap: 10px;
    font-size: 12px;
    color: #94a3b8;
  }
  .legend-circle {

    opacity: 0.7;

  }

    flex-shrink: 0;
    position: relative;
  }
  .legend-line::after {
    content: '▶';
    position: absolute;
    right: -8px;
    top: -7px;
    font-size: 9px;
    color: #a78bfa;
  }

  #stats {
    position: absolute;
    top: 24px; right: 32px;
    z-index: 10;
    text-align: right;
  }
  .stat {
    font-size: 12px;
    color: #64748b;
    margin-bottom: 4px;
  }
  .stat span {
    color: #94a3b8;
    font-weight: 600;
  }

  #tooltip {
    position: fixed;
    background: #1e2433;
    border: 1px solid #2d3748;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    max-width: 220px;
  }

    font-weight: 700;
    font-size: 13px;
    color: #f1f5f9;
    margin-bottom: 4px;
  }
  #tooltip .tt-row {
    color: #94a3b8;
  }
  #tooltip .tt-row span {
    color: #e2e8f0;
    font-weight: 600;
  }

  .node-circle {
    cursor: pointer;
    transition: filter 0.2s;
  }
  .node-circle:hover {
    filter: brightness(1.3);
  }
  .node-label {
    pointer-events: none;
    user-select: none;
  }
  .edge-path {
    fill: none;
    transition: opacity 0.2s;
  }
  .edge-label {
    pointer-events: none;
    user-select: none;
  }
  .arrowhead { }
  #graph {
    position: absolute;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
  }
  /* Dimension selector */
  #dimension-selector {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #dimension-selector label {
    font-size: 11px;
    color: #64748b;
    white-space: nowrap;
  }
  #dimension-select {
    background: #1e2433;
    border: 1px solid #334155;
    border-radius: 6px;
    color: #cbd5e1;
    font-size: 12px;
    font-family: inherit;

// Group edges by source
const edgesBySource = {};
graphData.edges.forEach(e => {
  if (!edgesBySource[e.source]) edgesBySource[e.source] = [];
  edgesBySource[e.source].push(e);
});

const selfLoopOpacityMap = {};
const selfLoopForceMap = {};
Object.entries(edgesBySource).forEach(([src, srcEdges]) => {
  // Include the self-loop (if any) as an entry so it's bucketed on the same scale
  const sl = selfLoopMap[src];
  const allMoves = [...srcEdges];
  if (sl) allMoves.push({ source: src, target: src, count: sl.count, _isSelf: true });
  const total = departureTotals[src] || 1;
  const sorted = [...allMoves].sort((a, b) => b.count - a.count);
  const n = sorted.length;
  sorted.forEach((e, i) => {
    const bucket = Math.min(3, Math.floor(i / n * 4));
    const opacityIdx = 3 - bucket;
    if (e._isSelf) {
      selfLoopOpacityMap[src] = BUCKET_OPACITIES[opacityIdx];
      selfLoopForceMap[src] = +(e.count / total).toFixed(2);
    } else {
      const key = `${e.source}->${e.target}`;
      edgeOpacityMap[key] = BUCKET_OPACITIES[opacityIdx];
      edgeForceMap[key] = +(e.count / total).toFixed(2);
    }
  });
});
// For nodes that only have a self-loop (no cross-area edges), bucket separately
graphData.self_loops.forEach(s => {
  if (!(s.id in selfLoopOpacityMap)) {
    const total = departureTotals[s.id] || 1;
    selfLoopOpacityMap[s.id] = BUCKET_OPACITIES[3]; // only move = maximum opacity
    selfLoopForceMap[s.id] = +(s.count / total).toFixed(2);
  }
});

function getEdgeOpacity(d) {
  const src = d.source.id || d.source;
  const tgt = d.target.id || d.target;
  return edgeOpacityMap[`${src}->${tgt}`] || BUCKET_OPACITIES[0];
}
function getEdgeForce(d) {
  const src = d.source.id || d.source;
  const tgt = d.target.id || d.target;
  return edgeForceMap[`${src}->${tgt}`] || 0;
}

// IFoA edge opacities: bucket within IFoA outgoing edges
const ifoaEdgesRaw = graphData.edges.filter(e => e.is_ifoa_edge);
const ifoaTotal = ifoaEdgesRaw.reduce((s, e) => s + e.count, 0);
const ifoaSorted = [...ifoaEdgesRaw].sort((a, b) => b.count - a.count);
const ifoaOpacityMap = {};
const ifoaForceMap = {};
ifoaSorted.forEach((e, i) => {
  const bucket = Math.min(3, Math.floor(i / ifoaSorted.length * 4));
  ifoaOpacityMap[e.target] = BUCKET_OPACITIES[3 - bucket];
  ifoaForceMap[e.target] = +(e.count / ifoaTotal).toFixed(2);
});

function getIfoaEdgeOpacity(d) {
  const tgt = d.target.id || d.target;
  return ifoaOpacityMap[tgt] || BUCKET_OPACITIES[0];
}
function getIfoaEdgeForce(d) {
  const tgt = d.target.id || d.target;
  return ifoaForceMap[tgt] || 0;
}

function isNodeSelected(d) {

function isEdgeHighlighted(d) {
  const src = d.source.id || d.source;
  const tgt = d.target.id || d.target;

function getNodeFillOpacity(d) {

function boostOpacity(baseOpacity) {
  return Math.min(1, baseOpacity + 0.22);
}

function getHighlightedIfoaOpacity(d) {

function getHighlightedEdgeOpacity(d) {

// ── Tick ─────────────────────────────────────────────
function edgePath(d, sourceR, targetR, curve) {
  const dx = d.target.x - d.source.x;
  const dy = d.target.y - d.source.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const sx = d.source.x + dx / dist * (sourceR + 3);
  const sy = d.source.y + dy / dist * (sourceR + 3);
  const ex = d.target.x - dx / dist * (targetR + 12);
  const ey = d.target.y - dy / dist * (targetR + 12);
  if (!curve) return `M${sx},${sy} L${ex},${ey}`;
  const mx = (sx + ex) / 2 - dy / dist * 40;
  const my = (sy + ey) / 2 + dx / dist * 40;
  return `M${sx},${sy} Q${mx},${my} ${ex},${ey}`;
}
function edgeMidX(d, curve) {
  const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  return curve
    ? (d.source.x + d.target.x) / 2 - dy / dist * 40
    : (d.source.x + d.target.x) / 2;
}
function edgeMidY(d, curve) {
  const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  return curve
    ? (d.source.y + d.target.y) / 2 + dx / dist * 40
    : (d.source.y + d.target.y) / 2;
}

simulation.on("tick", () => {
  // IFoA edges — straight lines from centre
  ifoaEdgePaths.attr("d", d => edgePath(d, 40, radiusScale(d.target.actuary_years || 0), false));
  ifoaEdgeLabels
    .attr("x", d => edgeMidX(d, false))
    .attr("y", d => edgeMidY(d, false));

  // Career transition edges — curved
  edgePaths.attr("d", d => edgePath(
    d,
    radiusScale(d.source.actuary_years || 0),
    radiusScale(d.target.actuary_years || 0),
    true
  ));
  edgeLabels
    .attr("x", d => edgeMidX(d, true))
    .attr("y", d => edgeMidY(d, true));

  nodeContainers.attr("transform", d => `translate(${d.x},${d.y})`);

  // Self-loops: circular arcs on each practice-area node
  const selfLoopData = nodes.filter(d => !d.is_ifoa && selfLoopMap[d.id]);

  const loops = selfLoopGroup.selectAll("g.self-loop")
    .data(selfLoopData, d => d.id);
  const loopsEnter = loops.enter().append("g").attr("class", "self-loop");
  loopsEnter.append("path").attr("class", "self-loop-path").attr("fill", "none").attr("stroke-linecap", "round");
  loopsEnter.append("path").attr("class", "self-loop-arrow");
  loopsEnter.append("text").attr("class", "self-loop-label").attr("text-anchor", "middle").attr("dominant-baseline", "central").attr("font-size", "9px").attr("font-weight", "700").style("pointer-events", "none");
  loopsAll = loopsEnter.merge(loops);

  loopsAll.each(function(d) {
    const g   = d3.select(this);
    const sl  = selfLoopMap[d.id];
    const r   = radiusScale(d.actuary_years || 0);
    const selfOpacity = selfLoopOpacityMap[d.id] || BUCKET_OPACITIES[0];

    // Two attachment points on node circumference, spread ±30° around top-right (-45°).
    const midAngle = -Math.PI / 4;
    const spread   = Math.PI / 6;
    const a1 = midAngle - spread;
    const a2 = midAngle + spread;
    const p1x = d.x + r * Math.cos(a1);
    const p1y = d.y + r * Math.sin(a1);
    const p2x = d.x + r * Math.cos(a2);
    const p2y = d.y + r * Math.sin(a2);
    const bulge    = r * 0.85;
    const outX     = d.x + (r + bulge) * Math.cos(midAngle);
    const outY     = d.y + (r + bulge) * Math.sin(midAngle);
    const cpSpread = r * 0.3;
    const cp1x = outX + cpSpread * Math.cos(midAngle - Math.PI / 2);
    const cp1y = outY + cpSpread * Math.sin(midAngle - Math.PI / 2);
    const cp2x = outX + cpSpread * Math.cos(midAngle + Math.PI / 2);
    const cp2y = outY + cpSpread * Math.sin(midAngle + Math.PI / 2);

    // Same colour/width as career edges; SVG marker arrow
    g.select(".self-loop-path")
      .attr("d", `M${p1x},${p1y} C${cp1x},${cp1y} ${cp2x},${cp2y} ${p2x},${p2y}`)
      .attr("stroke", "#6b9ab8")
      .attr("stroke-width", 2)
      .attr("opacity", selfOpacity)
      .attr("marker-end", "url(#arrow-2)");

    // Hide the separate hand-drawn arrow (marker does the job now)
    g.select(".self-loop-arrow").attr("d", "");
  });

  // Hover on whole group — matches career edge behaviour exactly
  loopsAll
    .on("mouseover", function(event, d) {
      d3.select(this).select(".self-loop-path")
        .attr("stroke", "#a8d4f0").attr("opacity", 1);
      const sl = selfLoopMap[d.id];
      const selfForce = +(sl.count / (departureTotals[d.id] || 1)).toFixed(2);
      showTooltip(
        `<div class="tt-title">${d.id} → ${d.id}</div>
         <div class="tt-row">Transition force: <span>${(+selfForce).toFixed(2)}</span></div>`,
        event
      );
    })
    .on("mousemove", (event) => {
      tooltip.style("left", (event.clientX + 16) + "px").style("top", (event.clientY - 10) + "px");
    })
    .on("mouseout", function(event, d) {
      d3.select(this).select(".self-loop-path")
        .attr("stroke", isSelfLoopHighlighted(d) ? "#bfe5ff" : "#6b9ab8")
        .attr("opacity", isSelfLoopHighlighted(d) ? getHighlightedSelfLoopOpacity(d) : (selfLoopOpacityMap[d.id] || BUCKET_OPACITIES[0]))
        .attr("stroke-width", isSelfLoopHighlighted(d) ? 3 : 2);
      hideTooltip();
    });

  updateSelectionStyles();
});
} // end buildGraph

// ── Initial render ───────────────────────────────────────────────────────────
buildGraph(graphData);

// ── Dimension selector ───────────────────────────────────────────────────────
document.getElementById('dimension-select').addEventListener('change', function() {
  const dim = this.value;
  buildGraph(allGraphData[dim]);
});

// ── Resize ───────────────────────────────────────────
window.addEventListener("resize", () => {
  // CSS handles SVG size; just re-centre the IFoA node
  if (ifoa_node) { ifoa_node.fx = getW() / 2; ifoa_node.fy = getH() / 2; }
  if (simulation) simulation.alpha(0.3).restart();
});

</script>
</body>
</html>
